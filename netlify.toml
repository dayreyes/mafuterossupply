[build]
  publish = "."
  functions = "netlify/functions"

  # Assemble the functions directory at deploy time.
  #
  # This shop is maintained through the GitHub web UI, which flattens dragged
  # folders on some browsers — so the backend files can end up loose at the repo
  # root instead of under netlify/functions/. Rather than demand a folder layout
  # the web uploader can't reliably produce, this puts them where Netlify
  # expects them just before it bundles.
  #
  # Each copy is guarded, so this is a no-op when the repo already has the
  # proper structure (a git clone, or an upload that kept its folders). Both
  # layouts deploy identically.
  #
  # The entry files import './lib/<name>.js', which resolves correctly once the
  # two groups land in their respective directories.
  command = """
    mkdir -p netlify/functions/lib
    for f in auth shop orders signups codes; do
      [ -f "$f.js" ] && cp -f "$f.js" netlify/functions/
    done
    for f in session config invites http store notify; do
      [ -f "$f.js" ] && cp -f "$f.js" netlify/functions/lib/
    done
    echo "functions ready:"; ls netlify/functions netlify/functions/lib
  """

[functions]
  node_bundler = "esbuild"

# The service worker must never be served stale, or a deploy can leave a phone
# pinned to an old build that talks to endpoints that no longer exist.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Assets that genuinely never change. They live at the repo root rather than in
# folders so the whole site can be uploaded through the GitHub web UI, which
# flattens dragged folders on some browsers.
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/react*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Customer names, phone numbers and home addresses pass through this app, so
# lock down what the page is allowed to do and who may frame it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
